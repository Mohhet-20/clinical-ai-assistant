name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PUBMED_LIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check .
      - name: Tests with coverage gate
        run: pytest -q --cov --cov-report=term --cov-fail-under=85
      - name: Clinical quality gate (annotated gold set)
        run: python evaluate.py --gate --json eval-report.json
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: backend/eval-report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end + accessibility (Playwright, axe-core WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Desktop and mobile journeys, zero serious/critical WCAG violations
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (trains and hashes models)
        run: docker build -t clarity-api:ci ./backend
      - name: Smoke-test API container
        run: |
          docker run -d --name api -p 8000:8000 -e PUBMED_LIVE=false clarity-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/v1/ready && break; sleep 2; done
          curl -fsS -X POST http://localhost:8000/v1/analyze -H 'Content-Type: application/json' \
            -d '{"text":"Thirst. Glucose 182 mg/dL, BMI 33, age 45."}' | grep -q possible_conditions
      - name: Build UI image
        run: docker build -t clarity-ui:ci ./frontend
      - name: Smoke-test UI container
        run: |
          docker run -d --name ui -p 8080:8080 clarity-ui:ci
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
      - name: Scan images for vulnerabilities (fail on fixable critical/high)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: clarity-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Software bill of materials (CycloneDX)
        uses: anchore/sbom-action@v0.17.8
        with:
          image: clarity-api:ci
          format: cyclonedx-json
          output-file: sbom-api.cdx.json
