services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      AUDIT_LOG_PATH: /app/logs/audit.jsonl
    volumes:
      - audit-logs:/app/logs          # audit trail survives container restarts
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
  ui:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  audit-logs:
